<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | AV Management & Products</title><style>
:root{--bg:#050505;--panel:#10100e;--gold:#e8aa2f;--gold2:#ffd86e;--muted:#aaa79f;--line:#3c2b12;--green:#63dfa0;--red:#ff8585}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 80% 0,#201505,transparent 30%),var(--bg);color:#fff;font-family:Arial,sans-serif}.wrap{width:min(1180px,92%);margin:auto}
nav{position:sticky;top:0;z-index:20;background:#050505ed;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.nav{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-weight:900}.brand img{width:62px;height:50px;object-fit:contain}.brand small{display:block;color:var(--gold);font-size:9px;letter-spacing:2px}.links{display:flex;gap:22px;flex-wrap:wrap;justify-content:flex-end}.links a{color:#bbb;text-decoration:none;font-size:13px}.links a:hover{color:var(--gold2)}
.btn{display:inline-block;border:0;border-radius:9px;padding:13px 18px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#080704;text-decoration:none;font-weight:900;font-size:13px;cursor:pointer}.ghost{display:inline-block;border:1px solid var(--line);border-radius:9px;padding:12px 17px;color:#fff;text-decoration:none;font-weight:700;font-size:13px}
.hero{min-height:640px;display:grid;grid-template-columns:1.08fr .92fr;gap:45px;align-items:center}.kicker{color:var(--gold2);font-weight:900;letter-spacing:3px;font-size:12px}.hero h1{font:700 clamp(48px,7vw,84px)/.95 Georgia,serif;letter-spacing:-3px;margin:18px 0}.hero h1 span{color:var(--gold2)}.hero p{color:var(--muted);font-size:18px;line-height:1.7;max-width:610px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:27px}.hero-card{border:1px solid var(--line);border-radius:23px;padding:18px;background:#0c0b09}.hero-card img{width:100%;height:380px;object-fit:contain;background:#000;border-radius:15px}
.page-banner{padding:34px 0 24px}.page-banner img{display:block;width:100%;max-height:430px;object-fit:cover;border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 55px #0008}
section{padding:72px 0}h2{font:700 38px Georgia,serif;margin:0 0 8px}.sub{color:#999;margin:0 0 28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card,.box{border:1px solid var(--line);border-radius:16px;background:#0e0e0c;padding:23px}.num{color:var(--gold);font-weight:900;letter-spacing:2px}.card h3{margin:12px 0 8px}.card p{color:#999;line-height:1.6;font-size:13px}
.schedule{display:grid;grid-template-columns:1fr 1fr;gap:12px}.slot{padding:17px;border:1px solid var(--line);border-radius:12px;background:#0e0e0c;display:flex;justify-content:space-between;align-items:center}.slot span{font-size:12px;color:var(--green)}.slot.booked span{color:var(--red)}.edit-note{color:#777;font-size:12px;margin-top:12px}
.calendar{padding:20px;border:1px solid var(--line);border-radius:17px;background:#0d0d0c}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.cal-cell{min-height:72px;padding:8px;border-radius:9px;background:#111;color:#aaa;font-size:11px;border:1px solid transparent}.cal-cell strong{display:block;color:#fff;font-size:15px}.cal-cell.available{border-color:#28533d;color:var(--green)}.cal-cell.booked{border-color:#5a2424;color:var(--red);background:#1c1011}.cal-cell.today{box-shadow:0 0 0 1px var(--gold2) inset}.cal-controls{display:flex;gap:8px;align-items:center}.cal-controls button,.smallbtn{border:1px solid var(--line);background:#111;color:#fff;border-radius:7px;padding:8px 11px;cursor:pointer}.admin{margin-top:16px;padding:16px;border:1px dashed #4a381c;border-radius:12px;background:#0b0b09}.admin summary{cursor:pointer;color:var(--gold2);font-weight:bold}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.admin-row{display:flex;gap:8px;align-items:center}.admin-row input,.admin-row select{flex:1}
.booking{display:grid;grid-template-columns:.7fr 1.3fr;gap:16px}label{display:block;font-size:12px;color:#bbb;font-weight:bold;margin:12px 0 6px}input,select,textarea{width:100%;padding:12px;background:#070707;color:#fff;border:1px solid var(--line);border-radius:8px}textarea{min-height:105px;resize:vertical}.submit{width:100%;margin-top:15px}.notice{padding:12px;border-radius:9px;background:#17120a;color:#d9c7a3;font-size:12px;line-height:1.5}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.product{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#0e0e0c}.prod-img{height:190px;background:linear-gradient(135deg,#211806,#080808);display:grid;place-items:center;font-size:65px}.prod-info{padding:18px}.price{color:var(--gold2);font-weight:900;margin:10px 0}.product a{margin-right:7px}
.cart-list{display:grid;gap:12px}.cart-item{display:grid;grid-template-columns:90px 1fr auto;gap:16px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:14px;background:#0e0e0c}.cart-item img{width:90px;height:80px;object-fit:cover;border-radius:10px;background:#111}.qty{display:flex;align-items:center;gap:8px}.qty button{border:1px solid var(--line);background:#111;color:#fff;border-radius:7px;padding:6px 10px}.total-box{margin-top:20px;padding:20px;border:1px solid var(--line);border-radius:15px;background:#0e0e0c}.empty{padding:40px;text-align:center;color:#999;border:1px dashed var(--line);border-radius:15px}
footer{padding:35px 0;color:#777;border-top:1px solid var(--line);font-size:12px}
@media(max-width:800px){.hero,.booking{grid-template-columns:1fr}.grid,.products{grid-template-columns:1fr}.schedule{grid-template-columns:1fr}.links{gap:12px}.nav{align-items:flex-start;padding:12px 0}.cart-item{grid-template-columns:70px 1fr}.cart-item>div:last-child{grid-column:2}}
.checkout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.summary-item{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.summary-item img{width:70px;height:60px;object-fit:cover;border-radius:8px}@media(max-width:800px){.checkout{grid-template-columns:1fr}}</style></head><body>
<nav><div class="wrap nav">
<a class="brand" href="index.html"><img src="image0.png" alt="AV Logo"><span>AV MANAGEMENT<small>AND PRODUCTS</small></span></a>
<div class="links">
<a href="index.html#services">Services</a>
<a href="schedule.html">Schedule</a>
<a href="products.html">Products</a>
<a href="cart.html">Cart <span id="cartCount">0</span></a>
</div></div></nav>

<main><div class="wrap page-banner"><img src="image1.png" alt="AV Management banner"></div><section><div class="wrap"><h2>Checkout</h2><p class="sub">Order form opens after you press Order Now. No direct WhatsApp order step is used here.</p><div class="checkout">
<div class="box"><h3>Order Summary</h3><div id="summary"></div><div id="summaryTotals"></div></div>
<div class="box"><h3>Delivery & Payment</h3><form id="orderForm">
<label>Full Name</label><input name="name" required>
<label>Phone Number</label><input name="phone" required>
<label>Email Address</label><input name="email" type="email" required>
<label>House / Flat Number</label><input name="house" required>
<label>Street / Area</label><input name="street" required>
<label>City</label><input name="city" required>
<label>Country</label><input name="country" required>
<label>Delivery Instructions</label><textarea name="instructions" placeholder="Optional delivery instructions"></textarea>
<label>Payment Method</label><select name="payment" required><option>Cash on Delivery</option><option>Card Payment (contactless/manual setup)</option></select>
<button class="btn submit">ORDER NOW</button></form></div></div></div></section></main><footer><div class="wrap">© AV Management & Products • Affan Vibes</div></footer>
<script>
function updateCount(){let c=JSON.parse(localStorage.getItem('av_cart')||'[]');document.querySelectorAll('#cartCount').forEach(x=>x.textContent=c.reduce((a,i)=>a+i.qty,0));}
function renderSummary(){let c=JSON.parse(localStorage.getItem('av_cart')||'[]');let s=document.getElementById('summary');if(!c.length){s.innerHTML='<div class="empty">Your cart is empty. <a href="products.html">Go to Products</a></div>';return;}s.innerHTML=c.map(p=>`<div class="summary-item"><img src="${p.image||'image0.png'}" alt=""><div>${p.name}<br><small>Qty: ${p.qty}</small></div><b>PKR ${(p.price*p.qty).toLocaleString()}</b></div>`).join('');let subtotal=c.reduce((a,p)=>a+p.price*p.qty,0),delivery=subtotal?250:0;document.getElementById('summaryTotals').innerHTML=`<p>Subtotal: PKR ${subtotal.toLocaleString()}</p><p>Delivery charges: PKR ${delivery.toLocaleString()}</p><h3>Total amount: PKR ${(subtotal+delivery).toLocaleString()}</h3>`;}
document.getElementById('orderForm').addEventListener('submit',e=>{e.preventDefault();let f=e.target,c=JSON.parse(localStorage.getItem('av_cart')||'[]');if(!c.length){alert('Your cart is empty.');return;}
let total=c.reduce((a,p)=>a+p.price*p.qty,0)+250;
let body=`NEW ORDER\nName: ${f.name.value}\nPhone: ${f.phone.value}\nEmail: ${f.email.value}\nAddress: House/Flat ${f.house.value}, ${f.street.value}, ${f.city.value}, ${f.country.value}\nDelivery instructions: ${f.instructions.value}\nPayment: ${f.payment.value}\nTotal: PKR ${total.toLocaleString()}\n\nProducts:\n`+c.map(p=>`${p.name} x ${p.qty} = PKR ${(p.price*p.qty).toLocaleString()}`).join('\n');
window.location.href='mailto:affanvibes501@gmail.com?subject='+encodeURIComponent('New Website Order')+'&body='+encodeURIComponent(body);});
updateCount();renderSummary();
</script></body></html>
